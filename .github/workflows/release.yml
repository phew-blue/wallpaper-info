name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }} # set the RUNNER variable to target a self-hosted pool
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install Go + build (windows/amd64, static, no CGO)
        # Fetch the toolchain directly rather than via setup-go: it behaves the same on
        # GitHub-hosted and on a self-hosted pool set through vars.RUNNER, where setup-go
        # is flaky against the NFS tool cache. Latest stable Go builds a go-1.23 module fine.
        run: |
          set -euo pipefail
          GO_VER="$(curl -fsSL 'https://go.dev/VERSION?m=text' | head -1)"
          echo "Using $GO_VER"
          curl -fsSL "https://go.dev/dl/${GO_VER}.linux-amd64.tar.gz" | tar -C "$RUNNER_TEMP" -xz
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/go/bin:$PATH"
          go version
          go test ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o wallpaper-info-windows-amd64.exe .
          # Same source, linked for the GUI subsystem. Windows creates a console window for a
          # console-subsystem exe launched from a shortcut before any of our code runs, so the
          # Startup entry can only be silent if the binary it points at never asks for one.
          # The console build stays the one you type at a prompt: a shell reads the subsystem
          # field to decide whether to wait for the process and wire up its stdout, so a GUI
          # build makes --version and --list-presets useless from a shell.
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -H windowsgui -X main.version=${GITHUB_REF_NAME}" \
            -o wallpaper-infow-windows-amd64.exe .

      - name: Setup Wine + Inno Setup
        id: inno
        uses: ./.github/actions/wine-inno

      - name: Build installer
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cp wallpaper-info-windows-amd64.exe installer/wallpaper-info.exe
          cp wallpaper-infow-windows-amd64.exe installer/wallpaper-infow.exe
          xvfb-run -a wine "${{ steps.inno.outputs.iscc }}" \
            "/DMyAppVersion=${VERSION}" installer/wallpaper-info.iss
          ls -la installer/Output/

      # The manifest describes assets uploaded in this same release, so it is generated first and
      # shipped alongside them: the release is the single source of truth, and nothing has to be
      # published to another repo.
      - name: Generate manifest + stage backgrounds and fonts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          go run ./tools/manifest \
            -version "${GITHUB_REF_NAME}" \
            -exe wallpaper-info-windows-amd64.exe \
            -setup "installer/Output/wallpaper-info-setup-${VERSION}.exe" \
            -backgrounds ./backgrounds \
            -stage "$RUNNER_TEMP/bg" \
            -fonts ./fonts \
            -stage-fonts "$RUNNER_TEMP/fonts" \
            -out manifest.json
          cat manifest.json
          cp "$RUNNER_TEMP"/bg/*.png .
          # A preset that ships its font needs that font in the release too, or every client
          # silently falls back to whatever the machine happens to have installed.
          cp "$RUNNER_TEMP"/fonts/*.ttf .
          ls -la background-*.png font-*.ttf

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          files: |
            wallpaper-info-windows-amd64.exe
            wallpaper-infow-windows-amd64.exe
            installer/Output/wallpaper-info-setup-*.exe
            manifest.json
            background-*.png
            font-*.ttf
          generate_release_notes: true

      # Provisioned machines fetch these without credentials, so prove that actually works rather
      # than assuming the repo is still public.
      - name: Verify the published manifest and every asset it advertises
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/manifest.json"
          code=000
          for i in 1 2 3 4 5; do
            code=$(curl -sIL -o /dev/null -w '%{http_code}' "$url")
            [ "$code" = "200" ] && break
            echo "attempt $i: HTTP $code — retrying"; sleep 5
          done
          [ "$code" = "200" ] || { echo "::error::manifest not publicly fetchable at $url ($code)"; exit 1; }
          curl -sL "$url" -o /tmp/manifest.json
          cat /tmp/manifest.json
          # A preset pointing at a dead URL is worse than no preset, so check them all.
          grep -o 'https://[^"]*' /tmp/manifest.json | sort -u | while read -r u; do
            c=$(curl -sIL -o /dev/null -w '%{http_code}' "$u")
            [ "$c" = "200" ] || { echo "::error::advertised asset missing: $u ($c)"; exit 1; }
            echo "ok $c $u"
          done
