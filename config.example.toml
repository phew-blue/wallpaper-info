# wallpaper-info config. Copy to your config dir and edit, or run `wallpaper-info --write-config`.
#   Windows : %APPDATA%\wallpaper-info\config.toml
#   macOS   : ~/.config/wallpaper-info/config.toml   (or $XDG_CONFIG_HOME)
#   Linux   : ~/.config/wallpaper-info/config.toml
# Flags override any value here (e.g. --accent "#40c4ff").

base      = ""          # background image path; "" = current desktop wallpaper, else a solid canvas
name      = ""          # centered label; "" = hostname, "-" = hide
font      = ""          # font family name or .ttf path; "" = Open Sans if installed, else Segoe UI
accent    = "#0092CA"   # colour of the "user @ host" line and centered label
secondary = "#6A7078"   # colour of the detail lines
watch     = 0           # re-render every N minutes (0 = run once)

# Preset id last applied from https://github.com/phew-blue/wallpaper-info/releases/latest/download/manifest.json.
# Values from the preset are used only where you have not set them yourself:
# defaults < preset < this file < command-line flags.
preset = ""          # e.g. "phew-blue"; "" = no preset, purely local config

# Where presets are looked up. A URL or a local path; "" = the published catalogue above.
# Set by the USB installer to a copy of the stick's catalogue, whose presets are licensed for
# internal use and are deliberately not published. Update checks ignore this and always ask the
# published release, so a machine pointed at a local catalogue still updates itself.
manifest = ""        # e.g. "C:\\Users\\you\\AppData\\Local\\Phew Blue\\wallpaper-info\\manifest.json"

[layout]
# bottom-right (default) | bottom-left | top-right | top-left
corner = "bottom-right"
# Ordered subset of: user, os, uptime, cpu, ram, disk, nics, wan
rows = ["user", "os", "uptime", "cpu", "ram", "disk", "nics", "wan"]
