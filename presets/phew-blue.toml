id          = "phew-blue"
name        = "phew-blue (default)"
description = "Brand wallpaper, cyan accent, hostname label"
accent      = "#0092CA"
secondary   = "#6A7078"
font        = "Open Sans"
label       = "hostname"

# Widths must match the directories under brand/assets/wallpapers/logo/png.
# NOTE: every top-level key must stay ABOVE [layout] — a key after a table header
# belongs to that table in TOML, which silently emptied this list once already.
backgrounds     = ["3840x2160", "2560x1440", "1920x1080"]

[layout]
corner = "bottom-right"
rows   = ["user", "os", "uptime", "cpu", "ram", "disk", "nics", "wan"]
